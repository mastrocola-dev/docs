name: adr-index

on:
  pull_request:
    paths: ['adr/**', 'index/**', '.github/workflows/adr-index.yml']
  push:
    branches: [main]
    paths: ['adr/**', 'index/**', '.github/workflows/adr-index.yml']

permissions:
  contents: read

concurrency:
  group: adr-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          path: docs

      - id: tree
        run: |
          set -euo pipefail
          current=$(git -C docs rev-parse HEAD:adr)
          test -n "$current" || { echo '::error::Empty adr/ tree hash: the index would be skipped as up to date'; exit 1; }
          indexed=$(jq -r '.adrTree // empty' docs/index/adrs.json 2>/dev/null || true)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "indexed=$indexed" >> "$GITHUB_OUTPUT"
          echo "Current adr/ tree $current; indexed ${indexed:-<none>}" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        uses: actions/checkout@v6
        with:
          repository: mastrocola-dev/service-agent
          path: service-agent

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        uses: actions/checkout@v6
        with:
          repository: mastrocola-dev/mcp-docs
          path: mcp-docs

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        uses: actions/setup-node@v6
        with:
          node-version-file: service-agent/.nvmrc
          cache: npm
          cache-dependency-path: |
            service-agent/package-lock.json
            mcp-docs/package-lock.json

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        run: |
          npm ci --prefix service-agent
          npm ci --prefix mcp-docs

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        working-directory: service-agent
        env:
          TRACE_DIR: ${{ runner.temp }}/traces
        run: |
          set -euo pipefail
          key=$(az keyvault secret show --vault-name '${{ vars.KEY_VAULT_NAME }}' --name anthropic-api-key-ci --query value -o tsv)
          test -n "$key"
          echo "::add-mask::$key"
          ANTHROPIC_API_KEY="$key" node src/cli.ts --agent adr-index 'Index all ADRs' > "$RUNNER_TEMP/adrs.json"

      - if: always() && steps.tree.outputs.current != steps.tree.outputs.indexed
        uses: actions/upload-artifact@v6
        with:
          name: trace
          path: ${{ runner.temp }}/traces
          if-no-files-found: ignore

      - if: steps.tree.outputs.current != steps.tree.outputs.indexed
        env:
          ADR_TREE: ${{ steps.tree.outputs.current }}
        run: |
          set -euo pipefail
          expected=$(ls docs/adr/*.md | wc -l)
          jq -e --argjson expected "$expected" '
            (.adrs | length) == $expected
            and ([.adrs[].id] | (length == (unique | length)))
            and all(.adrs[]; (.id | test("^ADR-[0-9]{3}$")) and (.path | test("^adr/[0-9]{3}-[a-z0-9-]+\\.md$")))
          ' "$RUNNER_TEMP/adrs.json" > /dev/null || { echo "::error::Generated index does not match adr/: expected $expected records with unique ids and valid paths"; exit 1; }
          for path in $(jq -r '.adrs[].path' "$RUNNER_TEMP/adrs.json"); do
            test -f "docs/$path" || { echo "::error::Generated index references a missing document: $path"; exit 1; }
          done
          mkdir -p docs/index
          jq --arg adrTree "$ADR_TREE" \
             --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg model "$(jq -r .model service-agent/agents/adr-index/agent.json)" \
             --arg serviceAgent "$(git -C service-agent rev-parse HEAD)" \
             '{ adrTree: $adrTree, generatedAt: $generatedAt, model: $model, serviceAgent: $serviceAgent, adrs: (.adrs | sort_by(.id)) }' \
             "$RUNNER_TEMP/adrs.json" > docs/index/adrs.json
          git -C docs config user.name 'github-actions[bot]'
          git -C docs config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C docs add index/adrs.json
          git -C docs commit -m 'Regenerate ADR index'
          git -C docs push

  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          set -euo pipefail
          test -f index/adrs.json || { echo '::error::Missing ADR index: it is generated only on pull requests touching adr/'; exit 1; }
          test "$(git rev-parse HEAD:adr)" = "$(jq -r .adrTree index/adrs.json)" || { echo '::error file=index/adrs.json::Stale ADR index: adr/ changed without a pull request; open one touching adr/ to regenerate it'; exit 1; }
