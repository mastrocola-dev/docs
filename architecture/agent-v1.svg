<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Agent base architecture</title>
<desc>The interface sends tasks to the agent host, which contains the control loop, context, guardrails and MCP client. The host talks to the LLM API, state and observability; the MCP client reaches the MCP servers.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;dominant-baseline:central}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.host{fill:#EEEDFE;stroke:#534AB7}.host-t{fill:#3C3489}
.comp{fill:#E1F5EE;stroke:#0F6E56}.comp-t{fill:#085041}.comp-s{fill:#0F6E56}
.ext{fill:#F1EFE8;stroke:#888780}.ext-t{fill:#2C2C2A}.ext-s{fill:#5F5E5A}
.group{fill:none;stroke:#888780;stroke-dasharray:4 4}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}.head{stroke:#73726C}
@media (prefers-color-scheme:dark){
.host{fill:#26215C;stroke:#AFA9EC}.host-t{fill:#EEEDFE}
.comp{fill:#085041;stroke:#5DCAA5}.comp-t{fill:#E1F5EE}.comp-s{fill:#9FE1CB}
.ext{fill:#444441;stroke:#B4B2A9}.ext-t{fill:#F1EFE8}.ext-s{fill:#D3D1C7}
.group{stroke:#B4B2A9}.arr,.head{stroke:#9C9A92}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="ext" x="150" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th ext-t" x="250" y="48" text-anchor="middle">Interface</text>
<text class="ts ext-s" x="250" y="68" text-anchor="middle">CLI or HTTP API</text>
<line class="arr" x1="250" y1="86" x2="250" y2="118" marker-end="url(#a)"/>
<rect class="host" x="30" y="120" width="430" height="200" rx="20" stroke-width="0.5"/>
<text class="th host-t" x="50" y="142">Agent host</text>
<rect class="comp" x="50" y="160" width="185" height="56" rx="8" stroke-width="0.5"/>
<text class="th comp-t" x="142" y="178" text-anchor="middle">Control loop</text>
<text class="ts comp-s" x="142" y="198" text-anchor="middle">Decides next step</text>
<rect class="comp" x="255" y="160" width="185" height="56" rx="8" stroke-width="0.5"/>
<text class="th comp-t" x="347" y="178" text-anchor="middle">Context</text>
<text class="ts comp-s" x="347" y="198" text-anchor="middle">History and compaction</text>
<rect class="comp" x="50" y="240" width="185" height="56" rx="8" stroke-width="0.5"/>
<text class="th comp-t" x="142" y="258" text-anchor="middle">Guardrails</text>
<text class="ts comp-s" x="142" y="278" text-anchor="middle">Limits and approval</text>
<rect class="comp" x="255" y="240" width="185" height="56" rx="8" stroke-width="0.5"/>
<text class="th comp-t" x="347" y="258" text-anchor="middle">MCP client</text>
<text class="ts comp-s" x="347" y="278" text-anchor="middle">Discovers and calls tools</text>
<line class="arr" x1="462" y1="152" x2="498" y2="152" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="arr" x1="462" y1="222" x2="498" y2="222" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="arr" x1="462" y1="292" x2="498" y2="292" marker-end="url(#a)"/>
<rect class="ext" x="500" y="124" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th ext-t" x="575" y="142" text-anchor="middle">LLM API</text>
<text class="ts ext-s" x="575" y="162" text-anchor="middle">Claude via SDK</text>
<rect class="ext" x="500" y="194" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th ext-t" x="575" y="212" text-anchor="middle">State</text>
<text class="ts ext-s" x="575" y="232" text-anchor="middle">Checkpoints</text>
<rect class="ext" x="500" y="264" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th ext-t" x="575" y="282" text-anchor="middle">Observability</text>
<text class="ts ext-s" x="575" y="302" text-anchor="middle">Traces and costs</text>
<line class="arr" x1="347" y1="298" x2="347" y2="366" marker-end="url(#a)"/>
<rect class="group" x="40" y="368" width="620" height="100" rx="12" stroke-width="0.5"/>
<text class="th ext-t" x="60" y="388">MCP servers (tools)</text>
<rect class="ext" x="60" y="404" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="ts ext-t" x="150" y="426" text-anchor="middle">File system</text>
<rect class="ext" x="260" y="404" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="ts ext-t" x="350" y="426" text-anchor="middle">External APIs</text>
<rect class="ext" x="460" y="404" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="ts ext-t" x="550" y="426" text-anchor="middle">Database</text>
</svg>
